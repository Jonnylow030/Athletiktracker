<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Athletik Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Saira+Condensed:wght@600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #060c27; }
  ::placeholder { color: rgba(255,255,255,0.45); }
  select option { background: #060c27; }
</style>

<!-- Bibliotheken -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2/umd/Recharts.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const {
  LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
} = Recharts;

/* ---------- Design Tokens ---------- */
const C = {
  bg: "linear-gradient(90deg, #060c27 0%, #00758f 100%)",
  accent: "#48cffd",
  text: "#ffffff",
  cardBg: "rgba(6,12,39,0.55)",
  cardBorder: "rgba(72,207,253,0.25)",
  inputBg: "rgba(255,255,255,0.07)",
};

const MOT = {
  green: { label: "Sehr motiviert", color: "#22c55e" },
  yellow: { label: "Durchschnittlich", color: "#eab308" },
  red: { label: "Wenig motiviert", color: "#ef4444" },
  darkred: { label: "Gar kein Bock", color: "#7f1d1d" },
};
const MOT_ORDER = ["green", "yellow", "red", "darkred"];

const METRICS = [
  { id: "squat", name: "Kniebeuge", unit: "kg", higherBetter: true },
  { id: "bench", name: "Bankdrücken", unit: "kg", higherBetter: true },
  { id: "sprint", name: "Sprint 30m", unit: "s", higherBetter: false },
  { id: "cmj", name: "Sprungkraft (CMJ)", unit: "cm", higherBetter: true },
  { id: "plank", name: "Plank", unit: "s", higherBetter: true },
];

/* ---------- Helpers ---------- */
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const MONTH_LABELS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

function buildMonths() {
  const out = [];
  const now = new Date(2026, 5, 1);
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    out.push({ key, label: MONTH_LABELS[d.getMonth()], full: `${MONTH_LABELS[d.getMonth()]} ${d.getFullYear()}` });
  }
  return out;
}
const MONTHS = buildMonths();
const CURRENT_MONTH = MONTHS[MONTHS.length - 1].key;

/* ---------- Seed-Daten ---------- */
const POSITIONS = ["Torwart","Linksaußen","Rückraum Links","Rückraum Mitte","Rückraum Rechts","Rechtsaußen","Kreisläufer"];
const PLANS = ["Kraft Aufbau", "Athletik Basis", "Reha / Prävention", "Maximalkraft"];
const NAMES = [
  "Lukas Berger","Jonas Wagner","Finn Hoffmann","Tim Schäfer","Max Becker",
  "Paul Richter","Noah Wolf","Leon Schulz","Felix Neumann","Erik Krüger",
  "Jan Hartmann","David Köhler","Niklas Braun","Tobias Lang","Marvin Frank",
  "Sven Albrecht","Dennis Vogel","Kevin Sommer","Robin Busch","Fabian Roth","Julian Engel",
];

function seedPlayers() {
  return NAMES.map((name, i) => {
    const rnd = mulberry32(i * 7 + 13);
    const position = POSITIONS[i % POSITIONS.length];
    const age = 18 + Math.floor(rnd() * 16);
    const plan = PLANS[Math.floor(rnd() * PLANS.length)];
    const data = {};
    METRICS.forEach((m) => {
      let base, step;
      if (m.id === "squat") { base = 80 + rnd() * 50; step = 1 + rnd() * 2.5; }
      else if (m.id === "bench") { base = 50 + rnd() * 40; step = 0.5 + rnd() * 1.5; }
      else if (m.id === "sprint") { base = 4.2 + rnd() * 0.6; step = -(0.01 + rnd() * 0.03); }
      else if (m.id === "cmj") { base = 30 + rnd() * 15; step = 0.2 + rnd() * 0.6; }
      else { base = 60 + rnd() * 90; step = 3 + rnd() * 6; }
      const series = [];
      for (let mo = 6; mo < 12; mo++) {
        const noise = (rnd() - 0.5) * step;
        let val = base + step * (mo - 6) + noise;
        val = m.id === "sprint" ? Math.round(val * 100) / 100 : Math.round(val);
        series.push({ month: MONTHS[mo].key, value: val });
      }
      data[m.id] = series;
    });
    const motivation = {};
    for (let mo = 6; mo < 12; mo++) {
      const r = rnd();
      const v = r < 0.45 ? "green" : r < 0.75 ? "yellow" : r < 0.92 ? "red" : "darkred";
      motivation[MONTHS[mo].key] = v;
    }
    return {
      id: i + 1, name, position,
      email: name.toLowerCase().replace(/ /g, ".").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue") + "@hsv-team.de",
      age, plan, data, motivation,
    };
  });
}

/* ---------- UI Bausteine ---------- */
function Card({ children, style }) {
  return (
    <div style={{ background: C.cardBg, border: `1px solid ${C.cardBorder}`, borderRadius: 18, padding: 18, backdropFilter: "blur(6px)", boxShadow: "0 8px 30px rgba(0,0,0,0.25)", ...style }}>
      {children}
    </div>
  );
}

function MotDot({ value, size = 16 }) {
  const m = value ? MOT[value] : null;
  return (
    <span title={m ? m.label : "Keine Angabe"} style={{ width: size, height: size, borderRadius: "50%", background: m ? m.color : "rgba(255,255,255,0.15)", display: "inline-block", boxShadow: m ? `0 0 8px ${m.color}` : "none", border: m ? "none" : "1px dashed rgba(255,255,255,0.3)", flexShrink: 0 }} />
  );
}

const fieldStyle = {
  background: C.inputBg, border: `1px solid ${C.cardBorder}`, borderRadius: 10,
  color: C.text, padding: "10px 12px", fontSize: 15, width: "100%", outline: "none", fontFamily: "inherit",
};

/* ---------- Spielerliste ---------- */
function PlayerList({ players, onSelect }) {
  const [q, setQ] = useState("");
  const filtered = players.filter((p) =>
    p.name.toLowerCase().includes(q.toLowerCase()) || p.position.toLowerCase().includes(q.toLowerCase()));
  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <h1 style={{ fontFamily: "'Saira Condensed', sans-serif", fontSize: 30, fontWeight: 700, margin: 0, letterSpacing: 0.5 }}>KADER</h1>
        <p style={{ margin: "2px 0 0", opacity: 0.7, fontSize: 14 }}>{players.length} Athleten · Stand {MONTHS[MONTHS.length - 1].full}</p>
      </div>
      <input placeholder="Suche nach Name oder Position…" value={q} onChange={(e) => setQ(e.target.value)} style={{ ...fieldStyle, marginBottom: 16 }} />
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {filtered.map((p) => (
          <button key={p.id} onClick={() => onSelect(p.id)} style={{ display: "flex", alignItems: "center", gap: 14, background: C.cardBg, border: `1px solid ${C.cardBorder}`, borderRadius: 14, padding: "12px 14px", color: C.text, textAlign: "left", cursor: "pointer", fontFamily: "inherit" }}>
            <div style={{ width: 42, height: 42, borderRadius: "50%", background: "rgba(72,207,253,0.15)", border: `1px solid ${C.accent}`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Saira Condensed', sans-serif", fontWeight: 700, fontSize: 17, color: C.accent, flexShrink: 0 }}>
              {p.name.split(" ").map((n) => n[0]).join("")}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 600, fontSize: 16 }}>{p.name}</div>
              <div style={{ opacity: 0.65, fontSize: 13 }}>{p.position}</div>
            </div>
            <MotDot value={p.motivation[CURRENT_MONTH]} />
            <span style={{ color: C.accent, fontSize: 20, lineHeight: 1 }}>›</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------- Detailansicht ---------- */
function PlayerDetail({ player, onBack, onUpdate }) {
  const [selMetric, setSelMetric] = useState(METRICS[0].id);
  const [editInfo, setEditInfo] = useState(false);
  const [form, setForm] = useState({ ...player });
  const [meMetric, setMeMetric] = useState(METRICS[0].id);
  const [meMonth, setMeMonth] = useState(CURRENT_MONTH);
  const [meValue, setMeValue] = useState("");

  const metric = METRICS.find((m) => m.id === selMetric);

  const chartData = useMemo(() => {
    const series = player.data[selMetric] || [];
    const byMonth = {};
    series.forEach((s) => (byMonth[s.month] = s.value));
    return MONTHS.filter((m) => byMonth[m.key] != null).map((m) => ({ label: m.label, value: byMonth[m.key] }));
  }, [player, selMetric]);

  function saveInfo() { onUpdate({ ...player, ...form, age: Number(form.age) }); setEditInfo(false); }

  function addMeasurement() {
    if (meValue === "" || isNaN(Number(meValue))) return;
    const series = [...(player.data[meMetric] || [])];
    const idx = series.findIndex((s) => s.month === meMonth);
    const entry = { month: meMonth, value: Number(meValue) };
    if (idx >= 0) series[idx] = entry; else series.push(entry);
    series.sort((a, b) => a.month.localeCompare(b.month));
    onUpdate({ ...player, data: { ...player.data, [meMetric]: series } });
    setMeValue(""); setSelMetric(meMetric);
  }

  function setMotivation(monthKey, value) {
    onUpdate({ ...player, motivation: { ...player.motivation, [monthKey]: value } });
  }

  const last6 = MONTHS.slice(-6);

  return (
    <div>
      <button onClick={onBack} style={{ background: "none", border: "none", color: C.accent, fontSize: 15, cursor: "pointer", padding: 0, marginBottom: 16, fontFamily: "inherit" }}>‹ Zurück zum Kader</button>

      <Card style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
          <h2 style={{ fontFamily: "'Saira Condensed', sans-serif", fontSize: 26, margin: 0, fontWeight: 700 }}>{player.name}</h2>
          <button onClick={() => (editInfo ? saveInfo() : setEditInfo(true))} style={{ background: editInfo ? C.accent : "transparent", color: editInfo ? "#060c27" : C.accent, border: `1px solid ${C.accent}`, borderRadius: 8, padding: "5px 12px", fontSize: 13, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>
            {editInfo ? "Speichern" : "Bearbeiten"}
          </button>
        </div>
        {editInfo ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {[["name","Name","text"],["position","Position","text"],["email","E-Mail","email"],["age","Alter","number"],["plan","Trainingsplan","text"]].map(([k, label, type]) => (
              <div key={k}>
                <label style={{ fontSize: 12, opacity: 0.7 }}>{label}</label>
                <input type={type} value={form[k]} onChange={(e) => setForm({ ...form, [k]: e.target.value })} style={fieldStyle} />
              </div>
            ))}
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "10px 14px" }}>
            <Info label="Position" value={player.position} />
            <Info label="Alter" value={`${player.age} Jahre`} />
            <Info label="E-Mail" value={player.email} full />
            <Info label="Trainingsplan" value={player.plan} accent full />
          </div>
        )}
      </Card>

      <Card style={{ marginBottom: 14 }}>
        <SectionTitle>Entwicklungsübersicht</SectionTitle>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
          {METRICS.map((m) => (
            <button key={m.id} onClick={() => setSelMetric(m.id)} style={{ background: selMetric === m.id ? C.accent : "transparent", color: selMetric === m.id ? "#060c27" : C.text, border: `1px solid ${selMetric === m.id ? C.accent : C.cardBorder}`, borderRadius: 20, padding: "6px 12px", fontSize: 13, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>
              {m.name}
            </button>
          ))}
        </div>
        <div style={{ height: 220, marginLeft: -10 }}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={chartData} margin={{ top: 10, right: 10, bottom: 0, left: 0 }}>
              <CartesianGrid stroke="rgba(255,255,255,0.08)" />
              <XAxis dataKey="label" stroke="rgba(255,255,255,0.6)" tick={{ fontSize: 12 }} />
              <YAxis stroke="rgba(255,255,255,0.6)" tick={{ fontSize: 12 }} width={38} domain={["auto", "auto"]} />
              <Tooltip contentStyle={{ background: "#060c27", border: `1px solid ${C.accent}`, borderRadius: 10, color: "#fff" }} formatter={(v) => [`${v} ${metric.unit}`, metric.name]} />
              <Line type="monotone" dataKey="value" stroke={C.accent} strokeWidth={3} dot={{ r: 4, fill: C.accent }} activeDot={{ r: 6 }} />
            </LineChart>
          </ResponsiveContainer>
        </div>
        <p style={{ textAlign: "center", fontSize: 12, opacity: 0.6, margin: "6px 0 0" }}>
          {metric.name} in {metric.unit} · {metric.higherBetter ? "höher = besser" : "niedriger = besser"}
        </p>
        <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.cardBorder}` }}>
          <p style={{ fontSize: 13, fontWeight: 600, margin: "0 0 8px", color: C.accent }}>Neuen Wert eintragen</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <select value={meMetric} onChange={(e) => setMeMetric(e.target.value)} style={fieldStyle}>
              {METRICS.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
            <select value={meMonth} onChange={(e) => setMeMonth(e.target.value)} style={fieldStyle}>
              {MONTHS.map((m) => <option key={m.key} value={m.key}>{m.full}</option>)}
            </select>
            <input type="number" placeholder="Wert" value={meValue} onChange={(e) => setMeValue(e.target.value)} style={fieldStyle} />
            <button onClick={addMeasurement} style={{ background: C.accent, color: "#060c27", border: "none", borderRadius: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", fontSize: 15 }}>Speichern</button>
          </div>
        </div>
      </Card>

      <Card>
        <SectionTitle>Motivations-Dashboard</SectionTitle>
        <div style={{ display: "flex", justifyContent: "space-between", gap: 6, marginBottom: 16 }}>
          {last6.map((m) => (
            <div key={m.key} style={{ textAlign: "center", flex: 1 }}>
              <MotDot value={player.motivation[m.key]} size={26} />
              <div style={{ fontSize: 11, opacity: 0.65, marginTop: 5 }}>{m.label}</div>
            </div>
          ))}
        </div>
        <div style={{ paddingTop: 14, borderTop: `1px solid ${C.cardBorder}` }}>
          <p style={{ fontSize: 13, fontWeight: 600, margin: "0 0 8px", color: C.accent }}>Motivation {MONTHS[MONTHS.length - 1].full} eintragen</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {MOT_ORDER.map((key) => {
              const active = player.motivation[CURRENT_MONTH] === key;
              return (
                <button key={key} onClick={() => setMotivation(CURRENT_MONTH, key)} style={{ display: "flex", alignItems: "center", gap: 8, background: active ? MOT[key].color : "rgba(255,255,255,0.05)", border: `1px solid ${active ? MOT[key].color : C.cardBorder}`, borderRadius: 10, padding: "10px 12px", cursor: "pointer", color: C.text, fontFamily: "inherit", fontSize: 13, fontWeight: 600 }}>
                  <span style={{ width: 14, height: 14, borderRadius: "50%", background: MOT[key].color, flexShrink: 0 }} />
                  {MOT[key].label}
                </button>
              );
            })}
          </div>
        </div>
      </Card>
    </div>
  );
}

function Info({ label, value, accent, full }) {
  return (
    <div style={{ gridColumn: full ? "1 / -1" : "auto" }}>
      <div style={{ fontSize: 11, opacity: 0.6, textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</div>
      <div style={{ fontSize: 15, fontWeight: 600, color: accent ? C.accent : C.text }}>{value}</div>
    </div>
  );
}

function SectionTitle({ children }) {
  return <h3 style={{ fontFamily: "'Saira Condensed', sans-serif", fontSize: 19, fontWeight: 700, margin: "0 0 14px", letterSpacing: 0.5 }}>{children}</h3>;
}

/* ---------- App ---------- */
function App() {
  const [players, setPlayers] = useState(seedPlayers);
  const [selectedId, setSelectedId] = useState(null);
  const selected = players.find((p) => p.id === selectedId);
  function updatePlayer(updated) { setPlayers((prev) => prev.map((p) => (p.id === updated.id ? updated : p))); }
  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: "'Saira', sans-serif", padding: "20px 16px 60px" }}>
      <div style={{ maxWidth: 480, margin: "0 auto" }}>
        {selected
          ? <PlayerDetail player={selected} onBack={() => setSelectedId(null)} onUpdate={updatePlayer} />
          : <PlayerList players={players} onSelect={setSelectedId} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
